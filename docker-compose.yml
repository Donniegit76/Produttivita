version: '3.8'

services:
  fast_prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast_prod_app
    ports:
      - "8085:8080"   # Porta 8085 (server) per Nginx Proxy Manager o accesso diretto
    volumes:
      - ./data:/app/data   # VOLUME PERSISTENTE PER IL DATABASE (Non si perde mai nulla!)
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
