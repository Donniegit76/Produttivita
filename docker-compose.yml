services:
  fast_prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast_prod:3
    container_name: fast_prod_app
    ports:
      # porta esterna 8085 → interna 8080
      # BIND_ADDRESS: metti l'IP LAN del server (es. 192.168.1.50) per non esporre
      # la porta su altre interfacce. Default 0.0.0.0 (tutte le interfacce).
      - "${BIND_ADDRESS:-0.0.0.0}:8085:8080"
    volumes:
      # volume persistente: database SQLite + backup giornalieri
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?crea il file .env partendo da env.example}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:?crea il file .env partendo da env.example}
      - SESSION_SECRET=${SESSION_SECRET:?crea il file .env partendo da env.example}
      - TZ=${TZ:-Europe/Rome}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
